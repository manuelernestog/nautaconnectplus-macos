name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
      - name: Bundle app
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
          else
            ./scripts/build-app.sh
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NautaConnectPlus.app
          path: dist/NautaConnectPlus.app
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCHIVE="dist/NautaConnectPlus-${GITHUB_REF_NAME}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/NautaConnectPlus.app "$ARCHIVE"
          gh release create "${GITHUB_REF_NAME}" "$ARCHIVE" \
            --title "NautaConnectPlus ${GITHUB_REF_NAME}" \
            --generate-notes
